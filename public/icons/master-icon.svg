<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e7a52"/>
      <stop offset="100%" stop-color="#0a2e1c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#4dbe87" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4dbe87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pin-outer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4dbe87" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4dbe87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pin-mid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4dbe87" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4dbe87" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- Bottom glow -->
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <!-- Large P letter -->
  <text x="96" y="384"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="330"
    font-weight="700"
    fill="white"
    opacity="0.92">P</text>

  <!-- GPS pin - outer glow ring -->
  <circle cx="384" cy="160" r="96" fill="url(#pin-outer)"/>

  <!-- GPS pin - mid glow ring -->
  <circle cx="384" cy="160" r="58" fill="url(#pin-mid)"/>

  <!-- GPS pin - main dot -->
  <circle cx="384" cy="160" r="34" fill="#4dbe87"/>

  <!-- GPS pin - white center -->
  <circle cx="384" cy="160" r="16" fill="white"/>

  <!-- GPS pin - tail line -->
  <line x1="384" y1="194" x2="384" y2="278"
    stroke="#4dbe87"
    stroke-width="13"
    stroke-linecap="round"/>

  <!-- GPS pin - shadow ellipse at bottom of tail -->
  <ellipse cx="384" cy="288" rx="24" ry="10"
    fill="#4dbe87"
    opacity="0.4"/>
</svg>
