{% extends "base.html" %}

{% block title %}Login - Patacrib Kenya{% endblock %}

{% block content %}
<div class="container" style="max-width: 400px; margin: 4rem auto;">
    <div style="background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; margin-bottom: 2rem; color: var(--primary);">Login</h2>
        
        <form method="POST" action="/login">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email</label>
                <input type="email" name="email" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px;">
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password</label>
                <input type="password" name="password" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px;">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: var(--gray);">Don't have an account? <a href="/signup" style="color: var(--primary);">Sign Up</a></p>
        </div>
    </div>
</div>
{% endblock %}
